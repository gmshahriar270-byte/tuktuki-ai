<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tuktuki AI</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png" type="image/png">

  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tuktuki AI">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2ff;
    }

    .app {
      width: 100%;
      max-width: 700px;
      height: 100vh;
      margin: auto;
      background: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 14px 16px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-text {
      font-size: 18px;
      font-weight: bold;
    }

    .status {
      font-size: 11px;
      opacity: .8;
      margin-top: 3px;
    }

    #clearChat {
      border: 0;
      border-radius: 9px;
      padding: 8px 10px;
      background: #dc2626;
      color: white;
      font-size: 12px;
      cursor: pointer;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 85%;
      margin: 9px 0;
      padding: 11px 14px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 15px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .user {
      margin-left: auto;
      background: #dbeafe;
      border-bottom-right-radius: 5px;
    }

    .ai {
      margin-right: auto;
      background: #f1f5f9;
      border-bottom-left-radius: 5px;
    }

    .typing {
      font-style: italic;
      opacity: .7;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: white;
      border-top: 1px solid #e5e7eb;
    }

    #message {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
    }

    #message:focus {
      border-color: #6b7280;
    }

    #send {
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      background: #111827;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    @media (max-width: 480px) {
      .header {
        padding: 11px;
      }

      .brand-text {
        font-size: 16px;
      }

      .logo {
        width: 36px;
        height: 36px;
        font-size: 20px;
      }

      #clearChat {
        padding: 7px 8px;
        font-size: 11px;
      }

      #chat {
        padding: 14px 10px;
      }

      .message {
        max-width: 90%;
      }

      #send {
        padding: 0 14px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="brand">

      <div class="logo">
        <img
          src="/icon-192.png"
          alt="Tuktuki AI"
        >
      </div>

      <div>
        <div class="brand-text">
          Tuktuki AI
        </div>

        <div class="status">
          ● Online
        </div>
      </div>

    </div>

    <button id="clearChat">
      🗑️ Clear
    </button>

  </div>

  <div id="chat"></div>

  <div class="input-area">

    <input
      id="message"
      type="text"
      placeholder="এখানে লিখুন..."
      autocomplete="off"
    >

    <button id="send">
      Send
    </button>

  </div>

</div>

<script>
  const chat =
    document.getElementById("chat");

  const input =
    document.getElementById("message");

  const sendButton =
    document.getElementById("send");

  const clearButton =
    document.getElementById("clearChat");

  let history = [];

  try {

    history = JSON.parse(
      localStorage.getItem(
        "tuktuki_history"
      ) || "[]"
    );

    if (!Array.isArray(history)) {
      history = [];
    }

  } catch {

    history = [];

  }

  function saveHistory() {

    localStorage.setItem(
      "tuktuki_history",
      JSON.stringify(history)
    );

  }

  function addMessage(
    text,
    type,
    extraClass = ""
  ) {

    const div =
      document.createElement("div");

    div.className =
      "message " +
      type +
      " " +
      extraClass;

    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop =
      chat.scrollHeight;

    return div;
  }

  function loadChat() {

    chat.innerHTML = "";

    if (history.length === 0) {

      addMessage(
        "হ্যালো 👋 আমি Tuktuki AI।\nআমার সাথে চ্যাট করো!",
        "ai"
      );

      return;
    }

    history.forEach(item => {

      if (
        item.role === "user" ||
        item.role === "assistant"
      ) {

        addMessage(
          item.content,
          item.role === "user"
            ? "user"
            : "ai"
        );

      }

    });

  }

  clearButton.addEventListener(
    "click",
    () => {

      const confirmClear =
        confirm(
          "এই ডিভাইসের চ্যাট হিস্ট্রি মুছে ফেলতে চাও?"
        );

      if (!confirmClear) {
        return;
      }

      history = [];

      localStorage.removeItem(
        "tuktuki_history"
      );

      loadChat();

    }
  );

  async function sendMessage() {

    const message =
      input.value.trim();

    if (!message) {
      return;
    }

    addMessage(
      message,
      "user"
    );

    input.value = "";

    sendButton.disabled = true;

    const typing =
      addMessage(
        "Tuktuki AI লিখছে...",
        "ai",
        "typing"
      );

    try {

      const response =
        await fetch(
          "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              message: message,
              history: history
            })
          }
        );

      if (!response.ok) {

        throw new Error(
          "Server error: " +
          response.status
        );

      }

      const data =
        await response.json();

      typing.remove();

      const reply =
        data.reply ||
        "দুঃখিত, কোনো উত্তর পাওয়া যায়নি।";

      addMessage(
        reply,
        "ai"
      );

      history.push({
        role: "user",
        content: message
      });

      history.push({
        role: "assistant",
        content: reply
      });

      saveHistory();

    } catch (error) {

      typing.remove();

      addMessage(
        "দুঃখিত, সংযোগে সমস্যা হয়েছে।",
        "ai"
      );

      console.error(error);

    }

    sendButton.disabled = false;

    input.focus();

  }

  sendButton.addEventListener(
    "click",
    sendMessage
  );

  input.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {
        sendMessage();
      }

    }
  );

  loadChat();

  // PWA Service Worker
  if ("serviceWorker" in navigator) {

    window.addEventListener(
      "load",
      () => {

        navigator.serviceWorker
          .register("/sw.js")
          .catch(error => {

            console.log(
              "Service Worker:",
              error
            );

          });

      }
    );

  }
</script>

</body>
</html>
