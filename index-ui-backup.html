<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tuktuki AI</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png" type="image/png">

  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tuktuki AI">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;
      background: #eef2ff;
    }

    .app {
      width: 100%;
      max-width: 760px;
      height: 100dvh;
      margin: auto;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER */

    .header {
      flex-shrink: 0;
      padding: 13px 15px;
      background: #111827;
      color: white;

      display: flex;
      align-items: center;
      justify-content: space-between;

      box-shadow:
        0 2px 12px rgba(0, 0, 0, .18);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .logo {
      width: 42px;
      height: 42px;
      flex-shrink: 0;

      border-radius: 50%;
      overflow: hidden;

      background: white;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, .25);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-info {
      min-width: 0;
    }

    .brand-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .2px;
    }

    .status {
      margin-top: 3px;
      font-size: 11px;
      opacity: .75;
    }

    #clearChat {
      border: 0;
      outline: 0;

      padding: 8px 11px;

      border-radius: 10px;

      background: #dc2626;
      color: white;

      font-size: 12px;
      font-weight: 600;

      cursor: pointer;

      transition:
        transform .15s,
        opacity .15s;
    }

    #clearChat:active {
      transform: scale(.95);
    }

    /* CHAT */

    #chat {
      flex: 1;

      overflow-y: auto;

      padding: 20px 14px 14px;

      scroll-behavior: smooth;

      background:
        linear-gradient(
          180deg,
          #f8fafc 0%,
          #eef2f7 100%
        );
    }

    #chat::-webkit-scrollbar {
      width: 5px;
    }

    #chat::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 20px;
    }

    .message-row {
      display: flex;
      width: 100%;
      margin: 10px 0;
    }

    .message-row.user-row {
      justify-content: flex-end;
    }

    .message-row.ai-row {
      justify-content: flex-start;
    }

    .message {
      max-width: 82%;

      padding: 11px 14px;

      border-radius: 18px;

      line-height: 1.6;

      white-space: pre-wrap;
      word-break: break-word;

      font-size: 15px;

      box-shadow:
        0 2px 7px rgba(0, 0, 0, .07);

      animation:
        messageIn .18s ease;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .user {
      background: #111827;
      color: white;

      border-bottom-right-radius: 5px;
    }

    .ai {
      background: white;
      color: #111827;

      border: 1px solid #e5e7eb;

      border-bottom-left-radius: 5px;
    }

    .typing {
      color: #64748b;
      font-style: italic;
    }

    .typing::after {
      content: "...";
      animation: dots 1.2s infinite;
    }

    @keyframes dots {
      0% {
        opacity: .2;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: .2;
      }
    }

    /* INPUT */

    .input-area {
      flex-shrink: 0;

      display: flex;
      align-items: center;

      gap: 8px;

      padding:
        10px
        10px
        calc(10px + env(safe-area-inset-bottom));

      background: white;

      border-top:
        1px solid #e5e7eb;
    }

    #message {
      flex: 1;
      min-width: 0;

      height: 46px;

      padding:
        0 15px;

      border:
        1px solid #d1d5db;

      border-radius: 15px;

      outline: none;

      background: #f8fafc;

      color: #111827;

      font-size: 16px;

      transition:
        border-color .2s,
        background .2s,
        box-shadow .2s;
    }

    #message:focus {
      border-color: #64748b;

      background: white;

      box-shadow:
        0 0 0 3px
        rgba(100, 116, 139, .12);
    }

    #send {
      width: 48px;
      height: 46px;

      flex-shrink: 0;

      border: 0;

      border-radius: 15px;

      background: #111827;
      color: white;

      font-size: 20px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        transform .15s,
        background .15s;
    }

    #send:active {
      transform: scale(.93);
    }

    #send:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    /* MOBILE */

    @media (max-width: 480px) {

      .header {
        padding: 10px 11px;
      }

      .logo {
        width: 38px;
        height: 38px;
      }

      .brand-text {
        font-size: 16px;
      }

      .status {
        font-size: 10px;
      }

      #clearChat {
        padding: 7px 9px;
        font-size: 11px;
      }

      #chat {
        padding:
          15px 9px 12px;
      }

      .message {
        max-width: 90%;
        font-size: 15px;
        padding: 10px 13px;
      }

      .input-area {
        padding: 8px;
      }

      #message {
        height: 45px;
        font-size: 16px;
      }

      #send {
        width: 46px;
        height: 45px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <div class="brand">

      <div class="logo">
        <img
          src="/icon-192.png"
          alt="Tuktuki AI"
        >
      </div>

      <div class="brand-info">

        <div class="brand-text">
          Tuktuki AI
        </div>

        <div class="status">
          ● Online
        </div>

      </div>

    </div>

    <button id="clearChat">
      🗑️ Clear
    </button>

  </div>


  <!-- CHAT -->

  <div id="chat"></div>


  <!-- INPUT -->

  <div class="input-area">

    <input
      id="message"
      type="text"
      placeholder="Tuktuki AI-কে কিছু জিজ্ঞেস করুন..."
      autocomplete="off"
    >

    <button
      id="send"
      aria-label="Send"
    >
      ➤
    </button>

  </div>

</div>


<script>

  const chat =
    document.getElementById("chat");

  const input =
    document.getElementById("message");

  const sendButton =
    document.getElementById("send");

  const clearButton =
    document.getElementById("clearChat");


  /* =========================
     MEMORY
  ========================= */

  let history = [];

  try {

    history = JSON.parse(
      localStorage.getItem(
        "tuktuki_history"
      ) || "[]"
    );

    if (!Array.isArray(history)) {
      history = [];
    }

  } catch {

    history = [];

  }


  function saveHistory() {

    localStorage.setItem(
      "tuktuki_history",
      JSON.stringify(history)
    );

  }


  /* =========================
     ADD MESSAGE
  ========================= */

  function addMessage(
    text,
    type,
    extraClass = ""
  ) {

    const row =
      document.createElement("div");

    row.className =
      "message-row " +
      (type === "user"
        ? "user-row"
        : "ai-row");


    const div =
      document.createElement("div");

    div.className =
      "message " +
      type +
      " " +
      extraClass;

    div.textContent = text;


    row.appendChild(div);

    chat.appendChild(row);


    chat.scrollTop =
      chat.scrollHeight;


    return row;

  }


  /* =========================
     LOAD CHAT
  ========================= */

  function loadChat() {

    chat.innerHTML = "";


    if (history.length === 0) {

      addMessage(
        "হ্যালো 👋\nআমি Tuktuki AI।\nআমার সাথে চ্যাট করো!",
        "ai"
      );

      return;

    }


    history.forEach(item => {

      if (
        item.role === "user" ||
        item.role === "assistant"
      ) {

        addMessage(
          item.content,
          item.role === "user"
            ? "user"
            : "ai"
        );

      }

    });

  }


  /* =========================
     CLEAR CHAT
  ========================= */

  clearButton.addEventListener(
    "click",
    () => {

      const confirmClear =
        confirm(
          "এই ডিভাইসের চ্যাট হিস্ট্রি মুছে ফেলতে চাও?"
        );


      if (!confirmClear) {
        return;
      }


      history = [];


      localStorage.removeItem(
        "tuktuki_history"
      );


      loadChat();

    }
  );


  /* =========================
     SEND MESSAGE
  ========================= */

  async function sendMessage() {

    const message =
      input.value.trim();


    if (!message) {
      return;
    }


    addMessage(
      message,
      "user"
    );


    input.value = "";


    sendButton.disabled = true;

    input.disabled = true;


    const typing =
      addMessage(
        "Tuktuki AI লিখছে",
        "ai",
        "typing"
      );


    try {

      const response =
        await fetch(
          "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              message: message,
              history: history
            })
          }
        );


      if (!response.ok) {

        throw new Error(
          "Server error: " +
          response.status
        );

      }


      const data =
        await response.json();


      typing.remove();


      const reply =
        data.reply ||
        "দুঃখিত, কোনো উত্তর পাওয়া যায়নি।";


      addMessage(
        reply,
        "ai"
      );


      history.push({
        role: "user",
        content: message
      });


      history.push({
        role: "assistant",
        content: reply
      });


      saveHistory();

    } catch (error) {

      typing.remove();


      addMessage(
        "দুঃখিত 😥 সংযোগে সমস্যা হয়েছে। আবার চেষ্টা করো।",
        "ai"
      );


      console.error(error);

    }


    sendButton.disabled = false;

    input.disabled = false;

    input.focus();

  }


  /* =========================
     BUTTON
  ========================= */

  sendButton.addEventListener(
    "click",
    sendMessage
  );


  /* =========================
     ENTER
  ========================= */

  input.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !sendButton.disabled
      ) {

        sendMessage();

      }

    }
  );


  /* =========================
     START
  ========================= */

  loadChat();


  /* =========================
     PWA SERVICE WORKER
  ========================= */

  if (
    "serviceWorker" in navigator
  ) {

    window.addEventListener(
      "load",
      () => {

        navigator.serviceWorker
          .register("/sw.js")
          .catch(error => {

            console.log(
              "Service Worker:",
              error
            );

          });

      }
    );

  }

</script>

</body>
</html>
