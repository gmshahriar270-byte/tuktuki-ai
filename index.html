<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Tuktuki AI"
  >

  <title>Tuktuki AI</title>

  <link
    rel="manifest"
    href="/manifest.json"
  >

  <link
    rel="icon"
    href="/icon-192.png"
    type="image/png"
  >

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>


<body>

  <div class="app">


    <!-- HEADER -->

    <header class="header">

      <div class="brand">

        <div class="logo">

          <img
            src="/icon-192.png"
            alt="Tuktuki AI"
          >

        </div>


        <div class="brand-info">

          <div class="brand-text">
            Tuktuki AI
          </div>

          <div class="status">
            ● Online
          </div>

        </div>

      </div>


      <div class="header-buttons">

        <button
          id="themeToggle"
          type="button"
        >
          🌙
        </button>


        <button
          id="clearChat"
          type="button"
        >
          🗑️ Clear
        </button>

      </div>

    </header>



    <!-- CHAT -->

    <main id="chat"></main>



    <!-- IMAGE PREVIEW -->

    <div
      id="imagePreviewArea"
      style="display:none;"
    >

      <div class="image-preview-box">

        <img
          id="imagePreview"
          src=""
          alt="Selected image"
        >

        <button
          id="removeImage"
          type="button"
        >
          ✕
        </button>

      </div>

    </div>



    <!-- INPUT AREA -->

    <div class="input-area">


      <!-- IMAGE BUTTON -->

      <button
        id="imageButton"
        type="button"
        aria-label="ছবি নির্বাচন"
      >
        📷
      </button>


      <!-- HIDDEN FILE INPUT -->

      <input
        id="imageInput"
        type="file"
        accept="image/*"
        hidden
      >


      <!-- MESSAGE -->

      <input
        id="message"
        type="text"
        placeholder="এখানে লিখুন..."
        autocomplete="off"
      >


      <!-- VOICE -->

      <button
        id="voiceButton"
        type="button"
        aria-label="Voice Input"
      >
        🎤
      </button>


      <!-- SEND -->

      <button
        id="send"
        type="button"
        aria-label="Send"
      >
        ➤
      </button>

    </div>

  </div>



  <!-- APP JS -->

  <script src="/app.js"></script>



  <!-- SERVICE WORKER -->

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register("/sw.js")
            .then(() => {

              console.log(
                "Tuktuki AI Service Worker চালু হয়েছে"
              );

            })
            .catch(error => {

              console.log(
                "Service Worker Error:",
                error
              );

            });

        }
      );

    }

  </script>


</body>

</html>
