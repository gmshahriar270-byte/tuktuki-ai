<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuktuki AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
    }

    .app {
      width: 100%;
      max-width: 700px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 16px;
      background: #111827;
      color: white;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      max-width: 85%;
      margin: 10px 0;
      padding: 12px 15px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      background: #dbeafe;
    }

    .ai {
      margin-right: auto;
      background: #eeeeee;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #ddd;
    }

    #message {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 0 18px;
      background: #111827;
      color: white;
      font-size: 15px;
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    🤖 Tuktuki AI
  </div>

  <div id="chat"></div>

  <div class="input-area">
    <input
      id="message"
      type="text"
      placeholder="এখানে লিখুন..."
      autocomplete="off"
    >
    <button id="send">Send</button>
  </div>

</div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("message");
  const sendButton = document.getElementById("send");

  let history = [];

  try {
    history = JSON.parse(
      localStorage.getItem("tuktuki_history") || "[]"
    );

    if (!Array.isArray(history)) {
      history = [];
    }
  } catch {
    history = [];
  }

  function saveHistory() {
    localStorage.setItem(
      "tuktuki_history",
      JSON.stringify(history)
    );
  }

  function addMessage(text, type) {
    const div = document.createElement("div");

    div.className = "message " + type;
    div.textContent = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;

    return div;
  }

  function loadChat() {
    chat.innerHTML = "";

    if (history.length === 0) {
      addMessage(
        "হ্যালো 👋 আমি Tuktuki AI। আমার সাথে চ্যাট করো!",
        "ai"
      );
      return;
    }

    history.forEach(item => {
      if (
        item.role === "user" ||
        item.role === "assistant"
      ) {
        addMessage(
          item.content,
          item.role === "user" ? "user" : "ai"
        );
      }
    });
  }

  async function sendMessage() {
    const message = input.value.trim();

    if (!message) {
      return;
    }

    addMessage(message, "user");
    input.value = "";
    sendButton.disabled = true;

    const typing = addMessage(
      "Tuktuki AI লিখছে...",
      "ai"
    );

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: message,
          history: history
        })
      });

      if (!response.ok) {
        throw new Error("Server error: " + response.status);
      }

      const data = await response.json();

      typing.remove();

      const reply =
        data.reply ||
        "দুঃখিত, কোনো উত্তর পাওয়া যায়নি।";

      addMessage(reply, "ai");

      history.push({
        role: "user",
        content: message
      });

      history.push({
        role: "assistant",
        content: reply
      });

      saveHistory();

    } catch (error) {
      typing.remove();

      addMessage(
        "দুঃখিত, সংযোগে সমস্যা হয়েছে।",
        "ai"
      );

      console.error(error);
    }

    sendButton.disabled = false;
    input.focus();
  }

  sendButton.addEventListener(
    "click",
    sendMessage
  );

  input.addEventListener(
    "keydown",
    event => {
      if (event.key === "Enter") {
        sendMessage();
      }
    }
  );

  loadChat();
</script>

</body>
</html>
