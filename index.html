<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tuktuki AI">

  <title>Tuktuki AI</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">

    <div class="brand">

      <div class="logo">
        <img src="/icon-192.png" alt="Tuktuki AI">
      </div>

      <div class="brand-info">
        <div class="brand-text">Tuktuki AI</div>
        <div class="status">
          <span class="online-dot"></span>
          Online
        </div>
      </div>

    </div>

    <div class="header-buttons">

      <button id="themeToggle" type="button" aria-label="Theme">
        🌙
      </button>

      <button id="clearChat" type="button">
        🗑️ <span>Clear</span>
      </button>

    </div>

  </header>


  <!-- CHAT -->
  <main id="chat"></main>


  <!-- IMAGE PREVIEW -->
  <div id="imagePreviewArea" class="image-preview-area">

    <div class="image-preview-box">

      <img
        id="imagePreview"
        src=""
        alt="Selected image"
      >

      <button
        id="removeImage"
        type="button"
        aria-label="Remove image"
      >
        ✕
      </button>

    </div>

  </div>


  <!-- INPUT -->
  <div class="input-area">

    <button
      id="imageButton"
      class="tool-button"
      type="button"
      aria-label="ছবি নির্বাচন"
    >
      📷
    </button>

    <input
      id="imageInput"
      type="file"
      accept="image/*"
      hidden
    >

    <div class="message-input-wrap">

      <input
        id="message"
        type="text"
        placeholder="Tuktuki AI-কে কিছু জিজ্ঞেস করুন..."
        autocomplete="off"
      >

    </div>

    <button
      id="voiceButton"
      class="tool-button"
      type="button"
      aria-label="Voice Input"
    >
      🎤
    </button>

    <button
      id="send"
      type="button"
      aria-label="Send"
    >
      ➤
    </button>

  </div>

</div>


<script src="/app.js"></script>

<script>

if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker
      .register("/sw.js")
      .then(() => {
        console.log("Tuktuki AI Service Worker চালু হয়েছে");
      })
      .catch(error => {
        console.log("Service Worker Error:", error);
      });

  });

}

</script>

</body>
</html>
